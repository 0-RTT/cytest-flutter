name: cytest
description: 候选代理筛选工具（Flutter 版）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  flutter_inappwebview: ^6.1.5
  dartssh2: ^2.10.0
  crypto: ^3.0.5

dependency_overrides:
  # AGP 9 移除了 getDefaultProguardFile('proguard-android.txt')，插件 1.1.3 尚未适配，
  # 这里 vendor 一份并把该行改为 -optimize 版本
  flutter_inappwebview_android:
    path: packages/flutter_inappwebview_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
