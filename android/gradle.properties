# CI（GitHub Actions ubuntu-latest）只有 7GB 内存，这里不能按本机 16GB 设：
# 原 -Xmx8G -XX:MaxMetaspaceSize=4G 合计 12GB，超过 runner 物理内存，属配置错误，预防性下调。
#
# ⚠️ 归因更正：v1.0.7 那次 CI 失败（Build release APK 44 秒 exit 1）**不是 OOM**，
# 真实原因是 Maven Central 返回 429 限流，Gradle 在依赖解析阶段就失败了（编译都没开始）。
# 当时因为「快速失败 + 无 Java 报错」误判为被内核 SIGKILL —— 但那两种现象在观感上
# 几乎一样，必须看日志里有没有 `What went wrong` 才能区分。
# 所以：不要因为「40 秒无声失败」就来调堆，先查 Gradle 依赖解析与网络。
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# CI 优化（2026-11-18）：
# - configuration-cache：**已实测不可用，别再加回来**。
#   Flutter Gradle 插件注册的 `:app:ReleaseMinSdkCheck` 任务里持有
#   Kotlin 插件的 `StoredPropertyStorage`（WeakHashMap/ReferenceQueue），
#   Gradle 在保存配置缓存时无法序列化它，直接：
#     "Configuration cache state could not be cached ... error writing value of type
#      'java.lang.ref.ReferenceQueue' ... task ':app:ReleaseMinSdkCheck'"
#   → BUILD FAILED（本地实测 2m09s 才失败，很贵）。
#   注意 `configuration-cache.problems=warn` 救不了：那是「读取时发现不兼容」的
#   降级开关，这里是「写入缓存时抛异常」，属于硬失败。
# - org.gradle.caching：**不要开**，但理由不是「变慢」。
#   2026-11-18 三次发版实测「Build release APK」：v1.0.25 343s、v1.0.26（开了
#   caching）463s、v1.0.27（关掉）585s。三次的 Gradle 依赖缓存**都未命中**
#   （日志：`Cache not found for input keys: gradle-Linux-…`），可见 343~585s 的
#   波动来自 runner 机型 / Maven 下载速度，与 caching 开关无关——别再把某一次
#   的时长归因到它身上。默认关闭即可，开了也拿不到收益（一次性 runner 没有
#   可复用的 build cache 后端）。
# - Kotlin 增量编译：**保持关闭**（原来的 kotlin.incremental=false 不要删）。
#   2026-11-18 实测：一旦恢复默认（true），本机 release 构建在
#   `:shared_preferences_android:compileReleaseKotlin` 直接失败：
#     "Could not close incremental caches in build/shared_preferences_android/
#      kotlin/compileReleaseKotlin/cacheable/caches-jvm/jvm/kotlin:
#      class-fq-name-to-source.tab, source-to-classes.tab, internal-name-to-source.tab"
#   清 build 目录、杀 daemon 都复现，属 Windows 上插件工程 ICS 写缓存失败。
kotlin.incremental=false
org.gradle.caching=true
