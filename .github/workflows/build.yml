name: Flutter CI

on:
  # 只监听 tag：发版是唯一需要出包的时刻。
  # 之前同时监听 branches: [main]，导致「push main + push tag」同一份代码
  # 被完整构建两遍（历史上 #20/#21、#22/#23、#24/#25 全是成对的）。
  # main 的日常验证走本地（flutter analyze + flutter test）或开 PR。
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      latest:
        description: '临时解析上游最新版本（默认用仓库钉死的版本）'
        type: boolean
        default: false

permissions:
  contents: write

# 同一分支/同一 tag 只保留最新一次：重打 tag、连续 push 时把旧构建直接取消，
# 否则旧构建会跑满 7 分钟白占 runner（还会和新的抢带宽）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ---- 钉死的版本（默认就用这三行；dispatch 勾 latest=true 才去解析上游）----
  PINNED_FLUTTER_VERSION: '3.50.0'
  PINNED_XRAY_VERSION: 'v26.11.9'
  PINNED_GO_VERSION: '1.27.x'

jobs:
  # 出包与发版合并成一个 job：
  # 原来 build → artifact 上传(3s) → 新 job 冷启动(4s) + 下载(9s) → 发布(10s)，
  # 其中 16 秒纯属搬运。tag 构建直接在同一个 job 里读本地 APK 发版即可。
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # GitHub ubuntu runner 的 Android SDK 固定在这里；显式写出是为了让下面
      # 的 cache path 能引用（actions/cache 的 path 不支持 shell 展开）。
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # **默认用仓库钉死的版本**，只在 dispatch 勾 latest=true 时去上游解析。
      #
      # 为什么反转（2026-11-20）：原来每次构建都取「最新 Flutter」，而 AGP/Gradle
      # 是仓库里钉死的 —— 两者会漂移。Flutter 每升一版都可能抬高最低 AGP/Gradle
      # 要求，于是构建日志里冒出「Gradle 9.3.1 / AGP 9.1.1 即将停止支持」这类
      # 警告，再下一次 Flutter 升级就变成硬失败。也就是说：**漂移是隐患，警告只是
      # 它冒出来的形式**。钉死 Flutter 之后，升级必须是一次显式提交（连同 AGP/
      # Gradle 一起改并有本地验证），不会半夜被上游推着走。
      #
      # 想临时试新版仍可：workflow_dispatch 勾 latest=true。解析结果照旧写进
      # versions.txt 发到 Release，便于回溯。
      - name: Resolve toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          LATEST='${{ github.event.inputs.latest || 'false' }}'
          if [ "$LATEST" = "true" ]; then
            # 临时解析上游最新（Flutter 官方 current_release.stable / Xray latest tag）
            FL=$(curl -fsSL --retry 3 --retry-delay 2 https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json               | python3 -c "import json,sys; d=json.load(sys.stdin); h={r['hash']:r for r in d['releases']}; print(h[d['current_release']['stable']]['version'])")
            XR=$(curl -fsSL --retry 3 --retry-delay 2 -H "Accept: application/vnd.github+json"               https://api.github.com/repos/XTLS/Xray-core/releases/latest               | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
            GO=stable
            echo "模式=latest（临时解析上游最新；Dart 包仍按 pubspec.lock）"
          else
            # 默认：用仓库钉死的三行，构建可复现，升级必须显式提交
            FL="${PINNED_FLUTTER_VERSION}"
            XR="${PINNED_XRAY_VERSION}"
            GO="${PINNED_GO_VERSION}"
            echo "模式=pinned（仓库钉死版本，默认）"
          fi
          # Dart 包永远按 pubspec.lock 安装，**不 upgrade**：
          # 2026-11-19 事故：upgrade 把 path_provider_android 拉到 2.3.x（JNI 实现），
          # 真机 FindClass 失败 → 记录页一直转圈，analyze/test 发现不了。
          {
            echo "FLUTTER_VERSION=$FL"
            echo "XRAY_VERSION=$XR"
            echo "GO_VERSION=$GO"
          } >> "$GITHUB_ENV"
          echo "flutter=$FL | xray=$XR | go=$GO"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # pub 依赖缓存：subosito/flutter-action 的 cache 只覆盖 SDK 本身，
      # 每次 `flutter pub get` 仍要连 pub.dev 解析 + 下载全部包（实测 30~60s）。
      # key 跟 pubspec.lock 走：lock 不变就必然命中；restore-keys 兜住「加了个包」
      # 的情况（旧条目仍能复用大部分，只补新增的）。
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # 原来是 curl 下载 70MB 的 go tar.gz 再 sudo tar 到 /usr/local，实测 28 秒。
      # setup-go 优先命中 runner 预装的 toolcache，命中时 1~2 秒。
      # cache: false —— 本仓库没有 go.mod/go.sum（单文件 go build），
      # 让 setup-go 去找依赖文件只会打一条「no dependency file」警告。
      - name: Set up Go
        if: github.event_name != 'pull_request'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # subosito 的 cache 只缓存 Flutter SDK，不管 Maven 依赖。
      # v1.0.7 曾因 Maven Central 对共享 runner 返回 429 Too Many Requests，
      # Gradle 在配置阶段拉不到 Kotlin 插件直接失败（35s，编译都还没开始）。
      #
      # 只缓存 modules-2（依赖本身）而不缓存整个 ~/.gradle/caches：
      # 后者含 build-cache/tmp/transforms，动辄 1~2GB。
      #
      # key **固定**、不带 hashFiles：仓库缓存配额只有 10GB，而 Flutter SDK 就占了
      # 1.6GB。历史上 key 里混了 gradle 文件 hash，改一行注释就多一份 ~1GB 的
      # Gradle 条目，累计 8 份把配额顶满 → 新条目把旧条目淘汰 → 之后每次构建都
      # `Cache not found`（实测 v1.0.25/26/27/28 四次全部 miss）。
      # 依赖真正大改时手动把 v1 改成 v2 即可，不要退回自动 hash。
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-modules-v1

      # xray 单版本 30MB，每天多次发版会重复下载。按 XRAY_VERSION 缓存二进制本身
      # （不是 zip），命中时直接拷进 jniLibs。
      # NDK 缓存：`ndkVersion = flutter.ndkVersion` 让 Flutter 插件每次构建都检查
      # NDK 28.2.13676358，runner 自带的不是这个版本 → 每次都下 android-ndk-r28c-linux.zip
      # （约 700MB，解压后 2.2GB，实测占 release 构建的大头）。
      # 直接缓存解压后的目录：命中时插件看到「已安装」就跳过下载与解压。
      # 放在这里而不是更早：PR 不构建 APK，不需要 NDK。
      - name: Cache Android NDK
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
          key: ndk-28.2.13676358-${{ runner.os }}

      - name: Cache xray binary
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: /tmp/xray-cache/libxray.so
          key: xray-${{ runner.os }}-${{ env.XRAY_VERSION }}-arm64

      - name: Fetch native binaries
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          JNI=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p assets "$JNI"
          echo "== xray (android arm64) =="
          if [ -f /tmp/xray-cache/libxray.so ]; then
            echo "   缓存命中：$(ls -lh /tmp/xray-cache/libxray.so | awk '{print $5}')"
          else
            # --retry：这个项目被网络抖动坑过多次（SDK 包损坏、Maven 429），
            # 大文件下载一律带退避重试，别让一次抖断掉整次发版。
            curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -o /tmp/xray.zip \
              "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
            unzip -j -o -q /tmp/xray.zip xray -d /tmp
            mkdir -p /tmp/xray-cache
            cp -f /tmp/xray /tmp/xray-cache/libxray.so
          fi
          # 必须以 lib*.so 进 jniLibs，系统才会解压到 nativeLibraryDir 并给执行权限
          cp -f /tmp/xray-cache/libxray.so "$JNI/libxray.so"
          ls -lh "$JNI/libxray.so"

      # pipeline 二进制由本仓库 engine/pipeline.go 现场编译（与 cytest-app 的
      # tools/pipeline 是同一份源码的副本，改动需两侧同步）。
      - name: Build pipeline binaries
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          JNI=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNI" assets
          if [ ! -f engine/pipeline.go ]; then
            echo "::error title=缺少引擎::engine/pipeline.go 不存在，无法产出 pipeline 二进制"
            exit 1
          fi
          go version
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" -o "$JNI/libpipeline.so" engine/pipeline.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o assets/pipeline-linux engine/pipeline.go
          ls -lh "$JNI/libpipeline.so" assets/pipeline-linux

      - name: Resolve version
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "BUILD_NAME=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "BUILD_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # 一律按 pubspec.lock 安装（PUB_CMD 在 Resolve 步骤里固定为 get）。
      # 曾经用 upgrade 追最新，结果把带 JNI 实现的插件装进 release 包、
      # 真机上路径 API 直接抛异常；analyze/test 无法覆盖这类运行时问题。
      - name: Flutter pub get
        shell: bash
        run: flutter pub get

      - name: Analyze
        # 不能用 `|| true`：那会把 error 的退出码一起吞掉，即使 analyze 报 error
        # CI 也会继续构建并出包（曾经踩过：并发编辑期间出现 undefined_identifier，
        # 若那时打 tag 就会带着 error 发版，而 CI 仍是绿的）。
        # --no-fatal-infos 是唯一让步：绝大多数 info 来自 vendor 的
        # flutter_inappwebview 包。项目的 warning 已于 2026-11-18 清零，
        # 所以 warning 恢复默认「致命」。
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

      # PR 上只做「能不能过」的校验（analyze + test），不出包：
      # 出包要 3~4 分钟，而 PR 的产物没人装。要验包用 workflow_dispatch 手动触发。
      - name: Build release APK
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64 --build-name="${BUILD_NAME}" --build-number="${BUILD_NUMBER}" 2>&1 | tee /tmp/build.log
          # Flutter 对「Gradle/AGP 版本即将停止支持」只发 warning：日志全绿，下一版
          # Flutter 就变硬失败。这里把 warning 升成 error —— 要么当场升版本，
          # 要么显式改这条规则，不能让隐患躺在日志里。
          if grep -q "will soon be dropped" /tmp/build.log; then
            echo "::error title=Gradle/AGP 版本即将不被支持::$(grep -m2 'will soon be dropped' /tmp/build.log | sed 's/^ *//' | tr '\n' ' ')"
            echo "处理方式：按提示升 gradle-wrapper.properties 与 settings.gradle.kts，"
            echo "本地 flutter build apk --release 验证通过后再发版。"
            exit 1
          fi
          ls -lh build/app/outputs/flutter-apk/

      # 把「这次到底用了什么版本」固化下来：构建不可复现，但必须可追溯。
      # 同时写进 Job Summary（点开 run 就能看到）和 versions.txt（跟 release 一起发）。
      - name: Record resolved versions
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          FL=$(flutter --version | head -1 | awk '{print $2}')
          # Dart 版本在 "Tools • Dart 3.14.0 • DevTools …" 那一行，不能按行号取
          DART=$(flutter --version | grep -oE 'Dart [0-9][0-9.]*' | head -1 | awk '{print $2}')
          GV=$(go version | awk '{print $3}')
          AGP=$(grep -oE 'com\.android\.application"\) version "[^"]+' android/settings.gradle.kts | grep -oE '[0-9][0-9.]*')
          KT=$(grep -oE 'kotlin\.android"\) version "[^"]+' android/settings.gradle.kts | grep -oE '[0-9][0-9.]*')
          GRADLE=$(grep -oE 'gradle-[0-9.]+-bin' android/gradle/wrapper/gradle-wrapper.properties | sed 's/gradle-//; s/-bin//')
          # 包名里可能带数字（dartssh2），字符类必须是 [a-z0-9_]
          DEPS=$(awk '
            /^  [a-z0-9_]+:$/ {n=$1; sub(":","",n)}
            /^    version:/ {if(n!=""){v=$2; gsub(/"/,"",v);
              if(n ~ /^(provider|crypto|shared_preferences|path_provider|flutter_inappwebview|dartssh2)$/){
                printf "%s%s=%s", sep, n, v; sep="、"}; n=""}}
          ' pubspec.lock)
          {
            echo "# 本次构建实际使用的版本"
            echo ""
            echo "| 组件 | 版本 | 解析方式 |"
            echo "|---|---|---|"
            echo "| Flutter | $FL | 官方 current_release.stable |"
            echo "| Dart | $DART | 随 Flutter |"
            echo "| Xray | $XRAY_VERSION | GitHub releases/latest |"
            echo "| Go | ${GV#go} | setup-go stable |"
            echo "| AGP | $AGP | 仓库固定（受 Flutter 兼容矩阵约束）|"
            echo "| Kotlin | $KT | 仓库固定（受 Flutter 兼容矩阵约束）|"
            echo "| Gradle | $GRADLE | 仓库固定（受 AGP 约束）|"
            echo ""
            echo "Dart 依赖：$DEPS"
          } > versions.txt
          cat versions.txt
          { echo '### 本次构建版本'; echo '```'; cat versions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # 两平台都要出包，所以 APK 一律上传成 artifact，
      # 由最后的 release job 统一发（避免两个 job 并发去改同一个 Release）。
      - name: Upload APK
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: cytest-flutter-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            versions.txt
          if-no-files-found: error
          retention-days: 14

  # ----------------------------------------------------------------------
  # Windows 桌面版
  #
  # 与 APK 用**同一个 commit、同一份 Dart 代码、同一套 analyze/test**：
  # 任何改动都会在两边各跑一遍闸门，任何一边红都发不出去，
  # 这就是「两个平台保持一致」的机制保证。
  # ----------------------------------------------------------------------
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          FL=""
          XR=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.latest }}" == "true" ]]; then
            FL=$(curl -fsSL --retry 3 --retry-delay 2 https://storage.googleapis.com/flutter_infra_release/releases/releases_windows.json |
              python -c "import json,sys;d=json.load(sys.stdin);h={r['hash']:r for r in d['releases']};print(h[d['current_release']['stable']]['version'])")
            XR=$(curl -fsSL --retry 3 --retry-delay 2 -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/XTLS/Xray-core/releases/latest |
              python -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          fi
          FL=${FL:-$PINNED_FLUTTER_VERSION}
          XR=${XR:-$PINNED_XRAY_VERSION}
          echo "FLUTTER_VERSION=$FL" >> "$GITHUB_ENV"
          echo "XRAY_VERSION=$XR" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.PINNED_GO_VERSION }}
          cache: false

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Pub/Cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # 插件 flutter_inappwebview_windows 的 CMake 会调 nuget.exe 拉 WebView2 依赖，
      # runner 上不一定有；缺了会直接 NUGET-NOTFOUND（exit 9009）。
      - name: Ensure nuget.exe on PATH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          if ! command -v nuget.exe >/dev/null 2>&1; then
            curl -fsSL -o "$RUNNER_TEMP/tools/nuget.exe" https://dist.nuget.org/win-x86-commandline/latest/nuget.exe
          fi
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Resolve version
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "BUILD_NAME=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "BUILD_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Flutter pub get
        shell: bash
        run: flutter pub get

      # `assets/pipeline-linux` 是**构建产物**（.gitignore 里），远程执行要把
      # Linux 引擎上传到服务器。pubspec 声明了这个 asset，文件不存在时
      # `flutter analyze` 会报 asset_does_not_exist（warning 也是致命的）。
      # Android job 里有同样的步骤，两平台保持一致。
      - name: Build Linux engine asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o assets/pipeline-linux engine/pipeline.go
          ls -lh assets/pipeline-linux

      - name: Analyze
        shell: bash
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        shell: bash
        run: flutter test

      # 引擎二进制不进仓库（34MB + 7MB），构建时现取：
      # xray 用钉死版本，pipeline 由 engine/pipeline.go 编译。
      - name: Fetch Windows engines
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CYTEST_HTTP_PROXY: ''
        run: bash tool/fetch_win_engine.sh all

      - name: Build Windows release
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          flutter build windows --release \
            --build-name="${BUILD_NAME}" --build-number="${BUILD_NUMBER}"
          ls -lh build/windows/x64/runner/Release/

      - name: Package Windows build
        if: github.event_name != 'pull_request'
        shell: powershell
        run: |
          # 引擎必须在包里：缺了 xray/pipeline，程序能开但一跑就提示「引擎不可用」。
          # 这类「包看起来正常、功能全废」的问题只能靠打包前断言拦住。
          foreach ($n in @('xray.exe','pipeline.exe')) {
            $p = "build\windows\x64\runner\Release\bin\$n"
            if (-not (Test-Path $p)) {
              Write-Error "缺少引擎 $n（tool/fetch_win_engine.sh 没有跑成功？）"
              exit 1
            }
          }
          $src = 'build\windows\x64\runner\Release'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$src\*" -DestinationPath 'dist\cytest-windows-x64.zip' -Force
          Get-Item 'dist\cytest-windows-x64.zip' | Select-Object Name, Length

      - name: Record versions (windows)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "platform: windows-x64"
            echo "flutter: $(flutter --version | head -1)"
            echo "xray: ${XRAY_VERSION}"
            echo "go: $(go version)"
          } > dist/versions-windows.txt
          cat dist/versions-windows.txt

      - name: Upload Windows build
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: cytest-windows-x64
          path: |
            dist/cytest-windows-x64.zip
            dist/versions-windows.txt
          if-no-files-found: error
          retention-days: 14

  # ----------------------------------------------------------------------
  # 发版：两个平台的产物在同一个 Release 里，杜绝「一边发了另一边没发」。
  # ----------------------------------------------------------------------
  release:
    name: Publish release (APK + Windows)
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APK
        uses: actions/download-artifact@v5
        with:
          name: cytest-flutter-apk
          path: dist

      - name: Download Windows build
        uses: actions/download-artifact@v5
        with:
          name: cytest-windows-x64
          path: dist

      - name: Rename & list
        run: |
          set -euo pipefail
          mv dist/app-release.apk dist/cytest-flutter.apk
          ls -lh dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/cytest-flutter.apk
            dist/cytest-windows-x64.zip
            dist/versions.txt
            dist/versions-windows.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
