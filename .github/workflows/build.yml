name: Flutter CI

on:
  # 只监听 tag：发版是唯一需要出包的时刻。
  # 之前同时监听 branches: [main]，导致「push main + push tag」同一份代码
  # 被完整构建两遍（历史上 #20/#21、#22/#23、#24/#25 全是成对的）。
  # main 的日常验证走本地（flutter analyze + flutter test）或开 PR。
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.50.0'
  XRAY_VERSION: 'v26.11.9'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # subosito 的 cache 只缓存 Flutter SDK，不管 Maven 依赖。
      # v1.0.7 曾因 Maven Central 对共享 runner 返回 429 Too Many Requests，
      # Gradle 在配置阶段拉不到 Kotlin 插件直接失败（35s，编译都还没开始）。
      # 缓存 ~/.gradle 后重复构建不再下载依赖，既避开限流也快很多。
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Fetch native binaries
        run: |
          set -euo pipefail
          JNI=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p assets "$JNI"
          echo "== xray (android arm64) =="
          curl -fsSL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          unzip -j -o -q /tmp/xray.zip xray -d /tmp
          # 必须以 lib*.so 进 jniLibs，系统才会解压到 nativeLibraryDir 并给执行权限
          mv -f /tmp/xray "$JNI/libxray.so"
          ls -lh "$JNI/libxray.so"

      - name: Download pipeline binaries from cytest-app release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # pipeline 二进制由 cytest-app 仓库的 CI 产出，这里直接取 latest release 的同名产物不可行，
          # 改为在本地用 Go 编译（同一份 pipeline.go 已复制到 engine/）
          mkdir -p android/app/src/main/jniLibs/arm64-v8a assets
          if [ -f engine/pipeline.go ]; then
            echo "使用内置 engine/pipeline.go 编译"
            curl -fsSL -o /tmp/go.tar.gz https://go.dev/dl/go1.27.1.linux-amd64.tar.gz
            sudo tar -C /usr/local -xzf /tmp/go.tar.gz
            export PATH="/usr/local/go/bin:$PATH"
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
              go build -trimpath -ldflags="-s -w" -o android/app/src/main/jniLibs/arm64-v8a/libpipeline.so engine/pipeline.go
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -ldflags="-s -w" -o assets/pipeline-linux engine/pipeline.go
            ls -lh android/app/src/main/jniLibs/arm64-v8a/libpipeline.so assets/pipeline-linux
          else
            echo "::error title=缺少引擎::engine/pipeline.go 不存在，无法产出 pipeline 二进制"
            exit 1
          fi

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "BUILD_NAME=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "BUILD_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        # 不能用 `|| true`：那会把 error 的退出码一起吞掉，即使 analyze 报 error
        # CI 也会继续构建并出包（曾经踩过：并发编辑期间出现 undefined_identifier，
        # 若那时打 tag 就会带着 error 发版，而 CI 仍是绿的）。
        # --no-fatal-warnings 是因为当前有 4 条基线 warning（remote×2、app_state:7、
        # fetch_page:10），先容忍 warning 让 error 真正能拦；清完 warning 后去掉它。
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release --target-platform android-arm64             --build-name="${BUILD_NAME}" --build-number="${BUILD_NUMBER}"
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cytest-flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: cytest-flutter-apk
          path: dist

      - name: Rename
        run: mv dist/app-release.apk dist/cytest-flutter.apk

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: dist/cytest-flutter.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
