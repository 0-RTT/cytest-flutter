name: Flutter CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.50.0'
  XRAY_VERSION: 'v26.11.9'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fetch native binaries
        run: |
          set -euo pipefail
          mkdir -p assets
          echo "== xray (android arm64) =="
          curl -fsSL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          unzip -j -o -q /tmp/xray.zip xray -d assets/
          ls -lh assets/xray

      - name: Download pipeline binaries from cytest-app release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # pipeline 二进制由 cytest-app 仓库的 CI 产出，这里直接取 latest release 的同名产物不可行，
          # 改为在本地用 Go 编译（同一份 pipeline.go 已复制到 engine/）
          if [ -f engine/pipeline.go ]; then
            echo "使用内置 engine/pipeline.go 编译"
            curl -fsSL -o /tmp/go.tar.gz https://go.dev/dl/go1.27.1.linux-amd64.tar.gz
            sudo tar -C /usr/local -xzf /tmp/go.tar.gz
            export PATH="/usr/local/go/bin:$PATH"
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
              go build -trimpath -ldflags="-s -w" -o assets/pipeline engine/pipeline.go
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -ldflags="-s -w" -o assets/pipeline-linux engine/pipeline.go
            ls -lh assets/pipeline assets/pipeline-linux
          else
            echo "::error title=缺少引擎::engine/pipeline.go 不存在，无法产出 pipeline 二进制"
            exit 1
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release --target-platform android-arm64
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cytest-flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
