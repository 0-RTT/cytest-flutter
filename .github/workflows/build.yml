name: Flutter CI

on:
  # 只监听 tag：发版是唯一需要出包的时刻。
  # 之前同时监听 branches: [main]，导致「push main + push tag」同一份代码
  # 被完整构建两遍（历史上 #20/#21、#22/#23、#24/#25 全是成对的）。
  # main 的日常验证走本地（flutter analyze + flutter test）或开 PR。
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      pinned:
        description: '用仓库里写死的版本（应急回退），而不是解析最新'
        type: boolean
        default: false

permissions:
  contents: write

# 同一分支/同一 tag 只保留最新一次：重打 tag、连续 push 时把旧构建直接取消，
# 否则旧构建会跑满 7 分钟白占 runner（还会和新的抢带宽）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ---- 钉死的版本（只在 dispatch 勾选 pinned=true 时使用）----
  PINNED_FLUTTER_VERSION: '3.50.0'
  PINNED_XRAY_VERSION: 'v26.11.9'
  PINNED_GO_VERSION: '1.27.x'

jobs:
  # 出包与发版合并成一个 job：
  # 原来 build → artifact 上传(3s) → 新 job 冷启动(4s) + 下载(9s) → 发布(10s)，
  # 其中 16 秒纯属搬运。tag 构建直接在同一个 job 里读本地 APK 发版即可。
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 每次构建都去上游解析「当前最新稳定版」，而不是用仓库里写死的常量：
      # - Flutter：官方 releases_linux.json 的 current_release.stable
      # - Xray   ：GitHub releases/latest 的 tag
      # - Go     ：交给 setup-go 的 stable（它自己解析最新稳定）
      # - Dart 包：flutter pub upgrade（在 pubspec 的 ^ 约束内取最新）
      #
      # 代价是构建不再逐字节可复现，所以解析结果写进 versions.txt 并作为
      # release 资产发布，出问题能回溯「那次到底用的什么版本」。
      # 应急回退：workflow_dispatch 勾选 pinned=true → 用 PINNED_* 那三个常量。
      - name: Resolve latest toolchain
        shell: bash
        run: |
          set -euo pipefail
          PINNED='${{ github.event.inputs.pinned || 'false' }}'
          if [ "$PINNED" = "true" ]; then
            FL="${PINNED_FLUTTER_VERSION}"
            XR="${PINNED_XRAY_VERSION}"
            GO="${PINNED_GO_VERSION}"
            PUB=get
            echo "模式=pinned（仓库写死版本）"
          else
            FL=$(curl -fsSL --retry 3 --retry-delay 2 \
              https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
              | python3 -c "import json,sys; d=json.load(sys.stdin); h={r['hash']:r for r in d['releases']}; print(h[d['current_release']['stable']]['version'])")
            XR=$(curl -fsSL --retry 3 --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/XTLS/Xray-core/releases/latest \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
            GO=stable
            PUB=upgrade
            echo "模式=latest（解析上游最新稳定版）"
          fi
          {
            echo "FLUTTER_VERSION=$FL"
            echo "XRAY_VERSION=$XR"
            echo "GO_VERSION=$GO"
            echo "PUB_CMD=$PUB"
          } >> "$GITHUB_ENV"
          echo "flutter=$FL | xray=$XR | go=$GO | pub=$PUB"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 原来是 curl 下载 70MB 的 go tar.gz 再 sudo tar 到 /usr/local，实测 28 秒。
      # setup-go 优先命中 runner 预装的 toolcache，命中时 1~2 秒。
      # cache: false —— 本仓库没有 go.mod/go.sum（单文件 go build），
      # 让 setup-go 去找依赖文件只会打一条「no dependency file」警告。
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # subosito 的 cache 只缓存 Flutter SDK，不管 Maven 依赖。
      # v1.0.7 曾因 Maven Central 对共享 runner 返回 429 Too Many Requests，
      # Gradle 在配置阶段拉不到 Kotlin 插件直接失败（35s，编译都还没开始）。
      #
      # 只缓存 modules-2（依赖本身）而不缓存整个 ~/.gradle/caches：
      # 后者含 build-cache/tmp/transforms，动辄 1~2GB。
      #
      # key **固定**、不带 hashFiles：仓库缓存配额只有 10GB，而 Flutter SDK 就占了
      # 1.6GB。历史上 key 里混了 gradle 文件 hash，改一行注释就多一份 ~1GB 的
      # Gradle 条目，累计 8 份把配额顶满 → 新条目把旧条目淘汰 → 之后每次构建都
      # `Cache not found`（实测 v1.0.25/26/27/28 四次全部 miss）。
      # 依赖真正大改时手动把 v1 改成 v2 即可，不要退回自动 hash。
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-modules-v1

      - name: Fetch native binaries
        run: |
          set -euo pipefail
          JNI=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p assets "$JNI"
          echo "== xray (android arm64) =="
          # --retry：这个项目被网络抖动坑过多次（SDK 包损坏、Maven 429），
          # 大文件下载一律带退避重试，别让一次抖断掉整次发版。
          curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          unzip -j -o -q /tmp/xray.zip xray -d /tmp
          # 必须以 lib*.so 进 jniLibs，系统才会解压到 nativeLibraryDir 并给执行权限
          mv -f /tmp/xray "$JNI/libxray.so"
          ls -lh "$JNI/libxray.so"

      # pipeline 二进制由本仓库 engine/pipeline.go 现场编译（与 cytest-app 的
      # tools/pipeline 是同一份源码的副本，改动需两侧同步）。
      - name: Build pipeline binaries
        run: |
          set -euo pipefail
          JNI=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNI" assets
          if [ ! -f engine/pipeline.go ]; then
            echo "::error title=缺少引擎::engine/pipeline.go 不存在，无法产出 pipeline 二进制"
            exit 1
          fi
          go version
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" -o "$JNI/libpipeline.so" engine/pipeline.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o assets/pipeline-linux engine/pipeline.go
          ls -lh "$JNI/libpipeline.so" assets/pipeline-linux

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "BUILD_NAME=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "BUILD_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # latest 模式用 upgrade（在 ^ 约束内取最新），pinned 模式用 get（严格按 lock）
      - name: Flutter pub (get / upgrade)
        shell: bash
        run: flutter pub "${PUB_CMD}"

      - name: Analyze
        # 不能用 `|| true`：那会把 error 的退出码一起吞掉，即使 analyze 报 error
        # CI 也会继续构建并出包（曾经踩过：并发编辑期间出现 undefined_identifier，
        # 若那时打 tag 就会带着 error 发版，而 CI 仍是绿的）。
        # --no-fatal-infos 是唯一让步：绝大多数 info 来自 vendor 的
        # flutter_inappwebview 包。项目的 warning 已于 2026-11-18 清零，
        # 所以 warning 恢复默认「致命」。
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64 \
            --build-name="${BUILD_NAME}" --build-number="${BUILD_NUMBER}"
          ls -lh build/app/outputs/flutter-apk/

      # 把「这次到底用了什么版本」固化下来：构建不可复现，但必须可追溯。
      # 同时写进 Job Summary（点开 run 就能看到）和 versions.txt（跟 release 一起发）。
      - name: Record resolved versions
        shell: bash
        run: |
          set -euo pipefail
          FL=$(flutter --version | head -1 | awk '{print $2}')
          DART=$(flutter --version | sed -n '2p' | awk '{print $2}')
          GV=$(go version | awk '{print $3}')
          AGP=$(grep -oE 'com\.android\.application"\) version "[^"]+' android/settings.gradle.kts | grep -oE '[0-9][0-9.]*')
          KT=$(grep -oE 'kotlin\.android"\) version "[^"]+' android/settings.gradle.kts | grep -oE '[0-9][0-9.]*')
          GRADLE=$(grep -oE 'gradle-[0-9.]+-bin' android/gradle/wrapper/gradle-wrapper.properties | sed 's/gradle-//; s/-bin//')
          DEPS=$(grep -E '^  (provider|crypto|shared_preferences|path_provider|flutter_inappwebview|dartssh2):' -A6 pubspec.lock \
            | awk '/^  [a-z_]+:$/{n=$1; sub(":","",n)} /^    version:/{if(n!=""){gsub(/[",]/,"",$2); printf "%s%s=%s", sep, n, $2; sep="、"; n=""}}')
          {
            echo "# 本次构建实际使用的版本"
            echo ""
            echo "| 组件 | 版本 | 解析方式 |"
            echo "|---|---|---|"
            echo "| Flutter | $FL | 官方 current_release.stable |"
            echo "| Dart | $DART | 随 Flutter |"
            echo "| Xray | $XRAY_VERSION | GitHub releases/latest |"
            echo "| Go | ${GV#go} | setup-go stable |"
            echo "| AGP | $AGP | 仓库固定（受 Flutter 兼容矩阵约束）|"
            echo "| Kotlin | $KT | 仓库固定（受 Flutter 兼容矩阵约束）|"
            echo "| Gradle | $GRADLE | 仓库固定（受 AGP 约束）|"
            echo ""
            echo "Dart 依赖：$DEPS"
          } > versions.txt
          cat versions.txt
          { echo '### 本次构建版本'; echo '```'; cat versions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # 非 tag 构建（PR / 手动触发）仍然留一份 artifact 方便下载排查；
      # tag 构建直接进下一步发版，省掉上传+下载的往返。
      - name: Upload APK (non-tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: cytest-flutter-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            versions.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/cytest-flutter.apk
          cp versions.txt dist/versions.txt
          ls -lh dist/

      - name: Upload to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/cytest-flutter.apk
            dist/versions.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
